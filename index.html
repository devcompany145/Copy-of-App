<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Developers | Elite Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #002b45; /* Brand Midnight Navy from Image */
      --secondary: #001a2a; /* Deeper Navy */
      --accent: #002b45; /* Unified with brand color */
      --error: #af1d1d;
      --dark: #002b45;
      --light: #f4f4f4;
      --white: #fcfcfc; /* Brand Alabaster Background from Image */
      --gray-100: #f8fafc;
      --gray-200: #e2e8f0;
      --gray-500: #64748b;
      --gray-800: #002b45;
      --shadow-sm: 0 1px 2px 0 rgb(0 43 69 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 43 69 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 43 69 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 43 69 / 0.15);
      --radius: 0rem;
      --transition-speed: 0.3s;
    }

    body.dark-mode {
      --white: #001a2a;
      --light: #002b45;
      --dark: #fcfcfc;
      --gray-100: #001a2a;
      --gray-200: #003a5c;
      --gray-500: #94a3b8;
      --gray-800: #fcfcfc;
    }

    [dir="rtl"] {
      font-family: 'Noto Sans Arabic', 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--dark);
      background-color: var(--white);
      line-height: 1.6;
      transition: background-color var(--transition-speed), color var(--transition-speed);
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    .section { padding: 8rem 0; }
    .bg-light { background-color: var(--light); }
    .text-center { text-align: center; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 2.5rem;
      font-weight: 700;
      border-radius: 0;
      border: none;
      gap: 0.5rem;
      transition: all 0.3s ease;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: 0.75rem;
    }

    .btn:hover { transform: translateY(-2px); opacity: 0.9; }
    .btn-primary { background: var(--primary); color: white; border: 1px solid var(--primary); }
    .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
    .btn-outline:hover { background: var(--primary); color: white; }

    .grid { display: grid; gap: 3.5rem; }
    .grid-2 { grid-template-columns: 1fr; }
    @media (min-width: 768px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1024px) {
      .grid-4 { grid-template-columns: repeat(4, 1fr); }
    }

    .card {
      background: var(--white);
      border-radius: 0;
      padding: 3.5rem;
      border: 1px solid var(--gray-200);
      transition: all 0.3s ease;
    }

    .card:not(.success-card):hover { border-color: var(--primary); box-shadow: var(--shadow-xl); }

    .input-field {
      width: 100%;
      padding: 1.25rem;
      border-radius: 0;
      border: 1px solid var(--gray-200);
      background-color: var(--white);
      color: var(--dark);
      font-family: inherit;
      transition: border-color 0.3s ease;
      font-size: 0.95rem;
    }
    
    .input-field:focus {
      outline: none;
      border-color: var(--primary);
    }

    .badge {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      background-color: var(--primary);
      color: white;
      border-radius: 0;
      font-size: 0.65rem;
      font-weight: 800;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
    }

    .feature-list li { display: flex; align-items: center; margin-bottom: 1rem; color: var(--gray-500); font-size: 0.9rem; }
    [dir="rtl"] .feature-list li svg { margin-left: 0.75rem; margin-right: 0; }
    [dir="ltr"] .feature-list li svg { margin-right: 0.75rem; margin-left: 0; }

    .theme-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 0;
      border: 1px solid var(--gray-200); background: transparent;
      color: var(--dark); cursor: pointer;
      transition: all 0.3s ease;
    }
    .theme-toggle:hover { border-color: var(--primary); color: var(--primary); }

    .footer-links { display: flex; flex-direction: column; gap: 0.85rem; color: var(--gray-500); font-size: 0.85rem; }
    .footer-links a { text-decoration: none; color: inherit; transition: color 0.3s ease; }
    .footer-links a:hover { color: var(--dark); }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }

    @keyframes popIn {
      0% { transform: translateY(10px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    h1, h2, h3, h4 {
      font-weight: 800;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }
  </style>
<script type="importmap">
{

</script>
</head>

  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
