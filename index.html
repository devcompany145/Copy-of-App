<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Solutions Provider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --secondary: #7c3aed;
      --accent: #2563eb;
      --error: #ef4444;
      --dark: #0f172a;
      --light: #f8fafc;
      --white: #ffffff;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-500: #64748b;
      --gray-800: #1e293b;
      --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --gradient-text: linear-gradient(135deg, #2563eb 0%, #9333ea 100%);
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.15), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      --radius: 0.75rem;
      --transition-speed: 0.3s;
    }

    body.dark-mode {
      --white: #0f172a;
      --light: #1e293b;
      --dark: #f8fafc;
      --gray-100: #1e293b;
      --gray-200: #334155;
      --gray-500: #94a3b8;
      --gray-800: #cbd5e1;
    }

    [dir="rtl"] {
      font-family: 'Noto Sans Arabic', 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--dark);
      background-color: var(--white);
      line-height: 1.6;
      transition: background-color var(--transition-speed), color var(--transition-speed);
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    .section { padding: 5rem 0; }
    .bg-light { background-color: var(--light); }
    .text-center { text-align: center; }

    .text-gradient {
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      border-radius: 0.5rem;
      border: none;
      gap: 0.5rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .btn:hover { transform: scale(1.05); }
    .btn-primary { background: var(--gradient-primary); color: white; box-shadow: var(--shadow-md); }
    .btn-outline { background: var(--white); color: var(--primary); border: 1px solid var(--gray-200); }

    .grid { display: grid; gap: 2rem; }
    .grid-2 { grid-template-columns: 1fr; }
    @media (min-width: 768px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1024px) {
      .grid-4 { grid-template-columns: repeat(4, 1fr); }
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 2rem;
      border: 1px solid var(--gray-200);
      transition: all 0.3s ease;
    }

    .card:not(.success-card):hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: var(--shadow-xl); }

    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--gray-200);
      background-color: var(--gray-100);
      color: var(--dark);
      font-family: inherit;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background-color: rgba(79, 70, 229, 0.1);
      color: var(--primary);
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .feature-list li { display: flex; align-items: center; margin-bottom: 0.75rem; color: var(--gray-500); }
    [dir="rtl"] .feature-list li svg { margin-left: 0.75rem; margin-right: 0; }
    [dir="ltr"] .feature-list li svg { margin-right: 0.75rem; margin-left: 0; }

    .theme-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 10px;
      border: 1px solid var(--gray-200); background: var(--white);
      color: var(--dark); cursor: pointer;
    }

    .footer-links { display: flex; flex-direction: column; gap: 0.75rem; color: var(--gray-500); }
    .footer-links a:hover { color: var(--primary); }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react/": "https://aistudiocdn.com/react@^19.2.1/",
      "react": "https://aistudiocdn.com/react@^19.2.1",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
      "lottie-web": "https://esm.sh/lottie-web@5.12.2",
      "@google/genai": "https://esm.sh/@google/genai"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
