<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Developers | Elite Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #002b45; /* Brand Midnight Navy */
      --secondary: #001a2a; /* Deeper Navy */
      --accent: #0062ff; /* Vibrant Royal Blue for high prominence */
      --error: #af1d1d;
      --dark: #002b45;
      --light: #f4f4f4;
      --white: #fcfcfc; /* Brand Alabaster Background */
      --gray-100: #f8fafc;
      --gray-200: #e2e8f0;
      --gray-500: #64748b;
      --gray-800: #002b45;
      --shadow-sm: 0 1px 2px 0 rgb(0 43 69 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 43 69 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 43 69 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 43 69 / 0.15);
      --radius: 0rem;
      --transition-speed: 0.3s;
      scroll-behavior: smooth;
    }

    body.dark-mode {
      --white: #001a2a;
      --light: #002b45;
      --dark: #fcfcfc;
      --gray-100: #001a2a;
      --gray-200: #003a5c;
      --gray-500: #94a3b8;
      --gray-800: #fcfcfc;
    }

    [dir="rtl"] {
      font-family: 'Noto Sans Arabic', 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--dark);
      background-color: var(--white);
      line-height: 1.6;
      transition: background-color var(--transition-speed), color var(--transition-speed);
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    .section { padding: 8rem 0; }
    .bg-light { background-color: var(--light); }
    .text-center { text-align: center; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 2.5rem;
      font-weight: 700;
      border-radius: 0;
      border: none;
      gap: 0.5rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: 0.75rem;
      text-decoration: none;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--primary); color: white; border: 1px solid var(--primary); }
    .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
    .btn-outline:hover { background: var(--primary); color: white; }

    @keyframes shine {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .btn-prominent {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 50%, var(--primary) 100%);
      background-size: 200% auto;
      animation: shine 8s linear infinite;
      color: white !important;
      box-shadow: 0 10px 40px -10px rgba(0, 98, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      letter-spacing: 0.2em;
    }

    .btn-prominent:hover {
      background-size: 100% auto;
      box-shadow: 0 15px 50px -10px rgba(0, 98, 255, 1);
      transform: translateY(-5px) scale(1.06);
      filter: brightness(1.2);
    }

    .btn-prominent::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.6s ease;
    }

    .btn-prominent:hover::after {
      left: 100%;
    }

    /* Tooltip Styles */
    .tooltip-wrapper {
      position: relative;
      display: inline-block;
    }

    .nav-tooltip {
      visibility: hidden;
      width: max-content;
      background-color: var(--primary);
      color: #fff;
      text-align: center;
      padding: 0.6rem 1rem;
      position: absolute;
      z-index: 1000;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%) translateY(5px);
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: var(--shadow-lg);
      pointer-events: none;
    }

    .nav-tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: var(--primary) transparent transparent transparent;
    }

    .tooltip-wrapper:hover .nav-tooltip {
      visibility: visible;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .grid { display: grid; gap: 3.5rem; }
    .grid-2 { grid-template-columns: 1fr; }
    @media (min-width: 768px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1024px) {
      .grid-4 { grid-template-columns: repeat(4, 1fr); }
    }

    .card {
      background: var(--white);
      border-radius: 0;
      padding: 3.5rem;
      border: 1px solid var(--gray-200);
      transition: all 0.3s ease;
    }

    .card:not(.success-card):hover { border-color: var(--primary); box-shadow: var(--shadow-xl); }

    .input-field {
      width: 100%;
      padding: 1.25rem;
      border-radius: 0;
      border: 1px solid var(--gray-200);
      background-color: var(--white);
      color: var(--dark);
      font-family: inherit;
      transition: border-color 0.3s ease;
      font-size: 0.95rem;
    }
    
    .input-field:focus {
      outline: none;
      border-color: var(--primary);
    }

    .badge {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      background-color: var(--primary);
      color: white;
      border-radius: 0;
      font-size: 0.65rem;
      font-weight: 800;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
    }

    .theme-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 0;
      border: 1px solid var(--gray-200); background: transparent;
      color: var(--dark); cursor: pointer;
      transition: all 0.3s ease;
    }
    .theme-toggle:hover { border-color: var(--primary); color: var(--primary); }

    .footer-links { display: flex; flex-direction: column; gap: 0.85rem; color: var(--gray-500); font-size: 0.85rem; }
    .footer-links a { text-decoration: none; color: inherit; transition: color 0.3s ease; cursor: pointer; }
    .footer-links a:hover { color: var(--dark); }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }

    @keyframes popIn {
      0% { transform: translateY(10px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    h1, h2, h3, h4 {
      font-weight: 800;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }
  </style>

</html>
