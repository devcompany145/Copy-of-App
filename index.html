<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Solutions Provider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --secondary: #7c3aed;
      --accent: #2563eb;
      --error: #ef4444;
      --dark: #0f172a;
      --light: #f8fafc;
      --white: #ffffff;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-500: #64748b;
      --gray-800: #1e293b;
      --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --gradient-text: linear-gradient(135deg, #2563eb 0%, #9333ea 100%);
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.15), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      --radius: 0.75rem;
      --transition-speed: 0.3s;
    }

    body.dark-mode {
      --white: #0f172a;
      --light: #1e293b;
      --dark: #f8fafc;
      --gray-100: #1e293b;
      --gray-200: #334155;
      --gray-500: #94a3b8;
      --gray-800: #cbd5e1;
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4), 0 4px 6px -4px rgb(0 0 0 / 0.4);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.5), 0 8px 10px -6px rgb(0 0 0 / 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--dark);
      background-color: var(--white);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color var(--transition-speed), color var(--transition-speed);
    }

    h1, h2, h3, h4, h5, h6 {
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: color 0.2s;
    }

    button {
      cursor: pointer;
      font-family: inherit;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .section {
      padding: 5rem 0;
    }

    .bg-light {
      background-color: var(--light);
    }

    .text-center {
      text-align: center;
    }

    .text-gradient {
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      border-radius: 0.5rem;
      border: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .btn:active {
      transform: scale(0.95); 
      transition-duration: 0.05s;
    }

    .btn-primary {
      background: var(--gradient-primary);
      color: white;
      box-shadow: var(--shadow-md);
    }

    .btn-primary:hover {
      box-shadow: var(--shadow-lg);
      filter: brightness(1.1);
    }

    .btn-primary:active {
      transform: scale(0.92);
      filter: brightness(0.8);
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.4);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      filter: grayscale(0.5);
      transform: none !important;
      box-shadow: none;
    }

    .btn-outline {
      background: var(--white);
      color: var(--primary);
      border: 1px solid var(--gray-200);
    }
    
    .btn-outline:hover {
      border-color: var(--primary);
      background-color: rgba(79, 70, 229, 0.05);
      box-shadow: var(--shadow-md);
    }

    .learn-more-btn:hover {
      background-color: rgba(79, 70, 229, 0.1);
    }

    .grid {
      display: grid;
      gap: 2rem;
    }

    .grid-2 {
      grid-template-columns: repeat(1, 1fr);
    }
    
    .grid-3 {
      grid-template-columns: repeat(1, 1fr);
    }

    .grid-4 {
      grid-template-columns: repeat(1, 1fr);
    }

    @media (min-width: 768px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 1024px) {
      .grid-4 { grid-template-columns: repeat(4, 1fr); }
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 2rem;
      border: 1px solid var(--gray-200);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color var(--transition-speed);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-xl);
      border-color: var(--primary);
    }

    .service-icon {
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card:hover .service-icon {
      transform: scale(1.15) rotate(6deg);
    }

    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--gray-200);
      background-color: var(--gray-100);
      color: var(--dark);
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--primary);
      background-color: var(--white);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .input-field:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .input-field.error {
      border-color: var(--error);
      background-color: rgba(239, 68, 68, 0.05);
    }

    .error-message {
      color: var(--error);
      font-size: 0.75rem;
      font-weight: 500;
      margin-top: 0.25rem;
      display: block;
      animation: slideDown 0.2s ease-out;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-spin {
      animation: spin 1s linear infinite;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--gray-800);
      font-size: 0.875rem;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background-color: rgba(79, 70, 229, 0.1);
      color: var(--primary);
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    .feature-list li {
      display: flex;
      align-items: center;
      margin-bottom: 0.75rem;
      color: var(--gray-500);
    }

    .feature-list svg {
      color: var(--primary);
      margin-right: 0.75rem;
      flex-shrink: 0;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }

    /* Dark Mode Toggle Switch Styles */
    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--gray-200);
      background: var(--white);
      color: var(--dark);
      transition: all 0.2s;
    }
    
    .theme-toggle:hover {
      background: var(--gray-100);
      border-color: var(--primary);
    }
  </style>
